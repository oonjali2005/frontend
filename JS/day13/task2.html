<!DOCTYPE html>
<html>
<head>
    <title>Hide Paragraph</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen flex flex-col justify-center items-center">

    <p id="para"  class=" bg-yellow-600 text-xl  p-4 text-blue-600">
        This is a sample paragraph. Click the button to hide me.
    </p>

    <button 
        onclick="hideParagraph()"
        class="mt-5 bg-black text-white px-6 py-2 rounded">
        Hide Paragraph
    </button>


<script>

    let paragraph = document.getElementById("para");

    function  hideParagraph(){

        paragraph.style.display = "none";

    }

</script>

</body>
</html>
