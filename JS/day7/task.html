let movies = [
{
    movie:"GOAT",
    collection:800
},
{
    movie:"Leo",
    collection:600
},
{
    movie:"Master",
    collection:500
}
];
let total = 0;
let highest = 0;
let highestMovie = "";

    total = total + movies[i].collection;
    if(movies[i].collection > highest){
        highest = movies[i].collection;
        highestMovie = movies[i].movie;
    }
}

console.log("Highest Collection:",highest);
console.log("Highest Movie:",highestMovie);
