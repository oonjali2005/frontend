<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Rose Petals Product Card</title>
</head>
<body class="bg-pink-50 flex justify-center items-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg overflow-hidden w-80">

        <img
            src="../../css/assets/images/rose.webp"
            alt="Rose Petals"
            class="w-full h-48 object-cover"
        >

        <div class="p-5">

            <h2 class="text-2xl font-bold text-pink-600 mb-2">
                Fresh Rose Soap
            </h2>

            <p class="text-gray-600 text-sm mb-4">
                Premium quality of rose bathing bar and best long lasting frangrance and make us feel good!!
            </p>

            <div class="flex flex-wrap gap-2 mb-4">
                <span class="bg-pink-100 text-pink-600 px-2 py-1 rounded text-xs">Fresh</span>
                <span class="bg-pink-100 text-pink-600 px-2 py-1 rounded text-xs">Natural</span>
                <span class="bg-pink-100 text-pink-600 px-2 py-1 rounded text-xs">Fragrant</span>
                <span class="bg-pink-100 text-pink-600 px-2 py-1 rounded text-xs">Premium</span>
            </div>

            <div class="flex justify-between items-center">
                <span class="text-green-600 font-bold text-lg">
                    ₹89
                </span>

                <button class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700">
                    Buy Now
                </button>
            </div>

        </div>

    </div>

</body>
</html>
